name: Android and arrival server
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -v
      - run: python -m unittest discover -s scripts/pleos/tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dochagjari-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
  android-device:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM on the dedicated runner
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell service check package | grep -q ': found'
            adb shell service check activity | grep -q ': found'
            adb shell wm size 1280x800
            adb shell wm density 160
            ./gradlew :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python scripts/process_restart_smoke.py --serial emulator-5554 --reset-test-data
            adb shell am start -W -n dev.leemh.dochagjari/.MainActivity
            adb exec-out screencap -p > app/build/reports/android-app.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-android-api34-device-results
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
