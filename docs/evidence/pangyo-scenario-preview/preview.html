 {title:'엘리베이터로 5층 이동',sub:'유모차 동반이라면 엘리베이터 우선',at:3.3,adviceTitle:'번호 대신 주변 단서로 설명합니다',advice:'현장 운행층 표에서 5층 정차를 확인해주세요. 5층에서는 유아휴게실·유아차 대여 쪽 엘리베이터를 출발점으로 지도 경로를 확인합니다. 주차장 승강기와의 호기 연결은 미확인입니다.',head:'5층 출발점 ',caption:'유아휴게실·유아차 대여 쪽 엘리베이터'},
 {title:'파란 선을 따라 매장으로',sub:'공식 지도의 실제 보행 경로',at:5,adviceTitle:'복도와 주변 매장으로 안내합니다',advice:'유아차 대여 코너에서 유아휴게실 쪽 복도로 이동해, 블루독베이비·밍크뮤 매장 블록을 돌아 에뜨와 입구로 가세요. 방향은 지도 기준입니다.',head:'공식 5층 경로 ',caption:'엘리베이터 → 유아휴게실 옆 복도 → 에뜨와'},

 {title:'방문 후 차로 돌아가기',sub:'저장한 주차 층·구역 단서 확인',at:11,adviceTitle:'돌아갈 위치를 기억합니다',advice:'방문이 끝나면 실제로 이용한 엘리베이터와 사진·메모에 남긴 주차 층·구역을 확인하세요. 이 예시에는 개인 주차 위치를 임의로 채워 넣지 않았습니다.',head:'귀환 안내 · 시나리오 ',caption:'실제 이용한 승강기와 주차 기록 확인'}

const els={route:document.querySelector('#route'),halo:document.querySelector('#halo'),traveler:document.querySelector('#traveler'),plane:document.querySelector('#plane'),scrub:document.querySelector('#scrub')};
const list=document.querySelector('#steps');steps.forEach((s,i)=>{const b=document.createElement('button');b.className='step';b.innerHTML='<span class="num">'+(i+1)+'</span><span><strong>'+s.title+'</strong><small>'+s.sub+'</small></span>';b.onclick=()=>{running=false;setProgress(s.at+(i===3?2:0));};list.appendChild(b)});
let running=false,start=0,current=0,tilted=true;const length=els.route.getTotalLength();
window.setProgress=function(t){current=Math.max(0,Math.min(13,t));let idx=0;steps.forEach((s,i)=>{if(current>=s.at)idx=i});document.querySelectorAll('.step').forEach((b,i)=>{b.classList.toggle('active',i===idx);b.classList.toggle('done',i<idx);b.setAttribute('aria-current',i===idx?'step':'false')});const s=steps[idx];document.querySelector('#adviceTitle').textContent=s.adviceTitle;document.querySelector('#advice').textContent=s.advice;document.querySelector('#captionTitle').textContent=s.head;document.querySelector('#caption').textContent=s.caption;const progress=Math.max(0,Math.min(1,(current-5)/4));els.route.style.strokeDashoffset=1-progress;els.halo.style.strokeDashoffset=1-progress;const pt=els.route.getPointAtLength(length*progress);els.traveler.setAttribute('cx',pt.x);els.traveler.setAttribute('cy',pt.y);els.traveler.style.opacity=current>=5&&current<9.2?1:0;els.scrub.value=current;document.querySelector('#time').textContent=current.toFixed(1)+' / 13초';els.plane.style.transform=tilted?'rotateX(32deg) rotateZ(-10deg)':'none';};
window.pausePreview=()=>{running=false};window.playPreview=()=>{running=true;start=performance.now();requestAnimationFrame(tick)};function tick(now){if(!running)return;setProgress((now-start)/1000);if(current<13)requestAnimationFrame(tick);else running=false;}
document.querySelector('#play').onclick=playPreview;document.querySelector('#pause').onclick=()=>{running=false};document.querySelector('#tilt').onclick=()=>{tilted=!tilted;document.querySelector('#tilt').textContent=tilted?'평면으로 보기':'기울여 보기';setProgress(current)};els.scrub.oninput=e=>{running=false;setProgress(Number(e.target.value))};setProgress(0);if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)playPreview();
</script></html>
